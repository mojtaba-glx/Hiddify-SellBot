name: Publish v6.0.4 Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout finalized v6.0.4
        uses: actions/checkout@v4
        with:
          ref: 021b8c7e27906eb2a755063513186f6e351b2291

      - name: Verify version
        run: test "$(tr -d '\r\n' < VERSION)" = "6.0.4"

      - name: Build release notes
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          start = text.index("## Hiddify-SellBot v6.0.4")
          end = text.index("## Hiddify-SellBot v6.0.3", start)
          Path("/tmp/release-notes.md").write_text(text[start:end].strip() + "\n", encoding="utf-8")
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v6.0.4 >/dev/null 2>&1; then
            gh release edit v6.0.4 \
              --title "Hiddify-SellBot v6.0.4 Stable" \
              --notes-file /tmp/release-notes.md
          else
            gh release create v6.0.4 \
              --target 021b8c7e27906eb2a755063513186f6e351b2291 \
              --title "Hiddify-SellBot v6.0.4 Stable" \
              --notes-file /tmp/release-notes.md
          fi
